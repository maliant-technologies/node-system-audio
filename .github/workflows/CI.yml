name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  DEBUG: 'napi:*'

jobs:
  # Cheap gates first, so a formatting slip doesn't wait on eight builds.
  check:
    name: fmt, clippy, deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install audio headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  build:
    name: ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macOS must build on macOS: the CoreAudio tap path links against
          # system frameworks that cannot be cross-compiled from Linux.
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm run build --target aarch64-apple-darwin

          - host: macos-latest
            target: x86_64-apple-darwin
            build: pnpm run build --target x86_64-apple-darwin

          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm run build --target x86_64-pc-windows-msvc

          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm run build --target aarch64-pc-windows-msvc

          # cpal needs ALSA headers on every Linux target, and PipeWire headers
          # for the monitor-source path.
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            setup: sudo apt-get update && sudo apt-get install -y libasound2-dev libpipewire-0.3-dev
            build: pnpm run build --target x86_64-unknown-linux-gnu

          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            setup: |
              sudo dpkg --add-architecture arm64
              sudo apt-get update
              sudo apt-get install -y gcc-aarch64-linux-gnu libasound2-dev:arm64
            build: pnpm run build --target aarch64-unknown-linux-gnu --use-napi-cross

          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
            setup: apk add --no-cache alsa-lib-dev
            build: pnpm run build --target x86_64-unknown-linux-musl

          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
            setup: apk add --no-cache alsa-lib-dev
            build: pnpm run build --target aarch64-unknown-linux-musl --use-napi-cross

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: ${{ !matrix.settings.docker }}
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        if: ${{ !matrix.settings.docker }}
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.settings.docker }}
        with:
          targets: ${{ matrix.settings.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}

      - name: Setup
        if: ${{ matrix.settings.setup && !matrix.settings.docker }}
        run: ${{ matrix.settings.setup }}
        shell: bash

      - name: Install dependencies
        if: ${{ !matrix.settings.docker }}
        run: pnpm install --frozen-lockfile

      - name: Build
        if: ${{ !matrix.settings.docker }}
        run: ${{ matrix.settings.build }}
        shell: bash

      - name: Build (docker)
        if: ${{ matrix.settings.docker }}
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.settings.docker }}
          options: '--user 0:0 -v ${{ github.workspace }}:/build -w /build'
          run: |
            ${{ matrix.settings.setup }}
            corepack enable
            pnpm install --frozen-lockfile
            ${{ matrix.settings.build }}

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: '*.node'
          if-no-files-found: error

  # Unit tests need no audio device. The live-capture suite skips itself when CI
  # is set, because hosted runners have no output device and a macOS runner has
  # nobody to answer the TCC prompt.
  test:
    name: test on ${{ matrix.host }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install audio headers
        if: matrix.host == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: pnpm install --frozen-lockfile
      - run: cargo test
      - uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.host == 'ubuntu-latest' && 'x86_64-unknown-linux-gnu' || matrix.host == 'macos-latest' && 'aarch64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
          path: .
      - run: pnpm run test:js

  publish:
    name: publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Moves each bindings-<target>/*.node into its matching npm/<platform>/.
      - name: Collect artifacts
        run: pnpm run artifacts

      - run: ls -R npm

      # `prepublishOnly` runs `napi pre-publish`, which writes the
      # optionalDependencies block into the root package.json and publishes each
      # npm/<platform> package. The root package goes last, so it never resolves
      # to platform packages that do not exist yet.
      - name: Publish
        run: |
          npm config set provenance true
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
